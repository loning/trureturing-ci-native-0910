  quarantine:
    justification: 复核基线 dev 4e0bfbf8f91abd22c33ee1dd617504689a4e8479。本次以实施席在热树上编译的 127 行探针取得机器判词,而非纸面论证:该探针把本 atom 的八条子句(b 0=0、b a<=a、b 幂等、Monotone b、goldenObserve 的因子分解律与非零、G(n) 整除 n、G 幂等、n 整除 m 推出 G(n) 整除 G(m))连同层区间的纤维刻画 golden_observe_fiber_iff 全部证出,lake env lean 退出码 0。orchestrator 亲验(非席位自报):探针源码无 sorry、无 admit、无 native_decide;print axioms 对五条承重定理均只报 propext, Classical.choice, Quot.sound;陈述逐条对照 CAS 原文未削弱;探针只 import 钉版 mathlib,直接冻结依赖为空集。决定性上游是 Nat.factorization_prod_pow_eq_self_of_le_factorization(mathlib Data/Nat/Factorization/Defs.lean:237),配合 Nat.greatestFib_fib、Nat.fib_greatestFib_le、Nat.greatestFib_mono、Nat.greatestFib_lt、Nat.le_greatestFib、Nat.factorization_le_iff_dvd、Nat.eq_of_factorization_eq。这修正了前一版判词的一处过强表述:前一版列出了同一批 mathlib 声明并断言它们均不陈述原文 G 的三个子句,实测它们经上述乘积因子分解定理即可闭合全部子句。据 CLAUDE.md 第 5 条四撇,本 atom 的判形为 bind-only 且无准入依据,故不得作为一个首次冻结模块的唯一内容单独落地。承载现状不变:coverage_gids 仍为空,receipts 无 cover_disposition,空覆盖只作账目事实,不作零承载证明。
    reentry_condition: 两条合法出路,取其一。其一,本卷某个有逃逸内容的模块在其活推导路径上真正消费这些事实时,把它们作为具名伴随定理写进该模块,并记录带方向的边(消费者指向前置),该模块冻结后以它覆盖本 atom。其二,若日后某条已冻结的 D5 公开定理逐字覆盖本 atom 的子句,直接 make cover,零 Lean。两条之外不得为本 atom 单独开实施席:判形证据是上面那份编译通过的探针,重跑它即可复算。
    blocker_class: missing-prerequisite
